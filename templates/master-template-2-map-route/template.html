      (() => {
        const t = gsap.timeline({ paused: true });
        const dur = {{DURATION_SECONDS}};

        // Ken Burns canvas zoom
        t.to('#{{SCENE_ID}}-bg-canvas', { scale: 1.05, duration: dur, ease: 'none' }, 0);

        // Maps reveal
        t.fromTo('#{{SCENE_ID}}-maps-stage', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 0.6);

        // Question card reveal
        t.fromTo('#{{SCENE_ID}}-question-card', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.8);

        // Spoken cue sequential option reveals
        t.to('#{{SCENE_ID}}-opt-1', { opacity: 1, duration: 0.35, ease: 'power2.out' }, {{CUE_OPT1_SECONDS}});
        t.to('#{{SCENE_ID}}-opt-2', { opacity: 1, duration: 0.35, ease: 'power2.out' }, {{CUE_OPT2_SECONDS}});
        t.to('#{{SCENE_ID}}-opt-3', { opacity: 1, duration: 0.35, ease: 'power2.out' }, {{CUE_OPT3_SECONDS}});

        t.set({}, {}, dur);
        window.__timelines = window.__timelines || {};
        window.__timelines.{{SCENE_ID}} = t;
